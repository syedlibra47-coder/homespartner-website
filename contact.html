<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — HomesPartner Real Estate | Dubai, UK, Pakistan & India Offices</title>
<meta name="description" content="Contact HomesPartner Real Estate for Dubai property buying, renting, selling, off-plan investment and property management. Visit our Sheikh Zayed Road head office or reach our UK, Karachi and Ahmedabad desks.">
<link rel="canonical" href="https://homespartner.ae/contact">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="contact.css">
</head>
<body>

<div class="noise-overlay"></div>

<!-- ===== HEADER ===== -->
<header class="site-header" id="header">
  <div class="container header-inner">
    <a href="index.html#top" class="brand" id="brandLink">
      <span class="logo-crop logo-crop--header"><img src="assets/logo.png" alt="HomesPartner Real Estate" class="brand-logo"></span>
    </a>
    <nav class="main-nav" id="mainNav"></nav>
    <div class="header-actions">
      <a href="index.html#contact" class="btn btn-gold btn-sm" id="headerCtaBtn">Get in Touch</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- ===== PAGE HERO ===== -->
<section class="page-hero" data-page="contact">
  <div class="hero-bg">
    <div class="hero-bg-media"></div>
    <svg class="grid-map" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <g class="grid-lines">
        <line x1="0" y1="120" x2="1600" y2="120"/>
        <line x1="0" y1="280" x2="1600" y2="280"/>
        <line x1="270" y1="0" x2="270" y2="500"/>
        <line x1="800" y1="0" x2="800" y2="500"/>
        <line x1="1330" y1="0" x2="1330" y2="500"/>
      </g>
    </svg>
  </div>
  <div class="container page-hero-inner">
    <p class="eyebrow" id="contactHeroEyebrow"></p>
    <h1 class="display" id="contactHeroHeading"></h1>
    <p id="contactHeroSubtitle"></p>
  </div>
</section>

<!-- ===== INTRO / SEO CONTENT ===== -->
<section class="contact-intro">
  <div class="container contact-intro-inner">
    <p class="eyebrow eyebrow--dark" id="contactIntroEyebrow"></p>
    <h2 class="display" id="contactIntroHeading"></h2>
    <p id="contactIntroParagraph1"></p>
    <p id="contactIntroParagraph2"></p>
  </div>
</section>

<!-- ===== GLOBAL NETWORK MAP ===== -->
<section class="offices contact-offices" id="offices">
  <div class="container">
    <div class="section-head reveal">
      <p class="eyebrow eyebrow--dark" id="contactNetworkEyebrow"></p>
      <h2 class="display" id="contactNetworkHeading"></h2>
      <p class="section-sub" id="contactNetworkSubtitle"></p>
    </div>

    <div class="network-diagram reveal">
      <svg viewBox="10 225 850 490" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <g class="map-bg"></g>
        <g class="route-lines" id="mapRouteLines">
          <path class="route" pathLength="1" d="M1693.07,553.50 Q1481.24,341.16 1269.41,328.83"/>
          <path class="route" pathLength="1" d="M1693.07,553.50 Q1738.09,529.98 1783.11,556.45" style="animation-delay:.3s"/>
          <path class="route" pathLength="1" d="M1693.07,553.50 Q1759.19,532.79 1825.31,572.07" style="animation-delay:.6s"/>
        </g>
        <g class="nodes" id="mapNodes">
          <g class="node" style="animation-delay:1.3s">
            <circle cx="1269.41" cy="328.83" r="5"/>
            <text x="1269.41" y="307.00" text-anchor="middle">LONDON</text>
          </g>
          <g class="node" style="animation-delay:1.55s">
            <circle cx="1783.11" cy="556.45" r="5"/>
            <text x="1783.11" y="534.00" text-anchor="middle">KARACHI</text>
          </g>
          <g class="node" style="animation-delay:1.8s">
            <circle cx="1825.31" cy="572.07" r="5"/>
            <text x="1843.56" y="564.76" text-anchor="start">AHMEDABAD</text>
          </g>
          <g class="node node--hub" style="animation-delay:.95s">
            <circle class="pulse" cx="1693.07" cy="553.50" r="7"/>
            <circle class="hub-dot" cx="1693.07" cy="553.50" r="7"/>
            <text x="1693.07" y="593.99" text-anchor="middle">DUBAI — MAIN OFFICE</text>
          </g>
        </g>
      </svg>
    </div>

    <div class="contact-office-grid" id="contactOfficeGrid"></div>
  </div>
</section>

<!-- ===== CONTACT FORM ===== -->
<section class="cta-banner" id="contact-form">
  <div class="container cta-inner cta-inner--embed">
    <p class="eyebrow" id="contactFormEyebrow"></p>
    <h2 class="display" id="contactFormHeading"></h2>
    <p id="contactFormSubtitle"></p>
    <div class="cta-form-embed">
      <iframe
        src="https://api.leadconnectorhq.com/widget/form/gcEoDFLQ6bFiP3NlV34B"
        style="width:100%;height:100%;border:none;border-radius:4px"
        scrolling="no"
        id="inline-gcEoDFLQ6bFiP3NlV34B-contact"
        data-layout="{'id':'INLINE'}"
        data-trigger-type="alwaysShow"
        data-trigger-value=""
        data-activation-type="alwaysActivated"
        data-activation-value=""
        data-deactivation-type="neverDeactivate"
        data-deactivation-value=""
        data-form-name="Dubai Website Form"
        data-height="569"
        data-layout-iframe-id="inline-gcEoDFLQ6bFiP3NlV34B-contact"
        data-form-id="gcEoDFLQ6bFiP3NlV34B"
        title="Dubai Website Form">
      </iframe>
    </div>
  </div>
</section>
<script src="https://link.msgsndr.com/js/form_embed.js"></script>

<!-- ===== FAQ (SEO) ===== -->
<section class="contact-faq">
  <div class="container contact-faq-inner">
    <p class="eyebrow eyebrow--dark" id="contactFaqEyebrow"></p>
    <h2 class="display" id="contactFaqHeading"></h2>
    <div class="faq-list" id="contactFaqList"></div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="logo-crop logo-crop--footer"><img src="assets/logo.png" alt="HomesPartner Real Estate" class="footer-logo"></span>
      <p id="footerBlurb"></p>
      <a class="footer-email" id="footerEmail" href="mailto:info@homespartner.ae">info@homespartner.ae</a>
    </div>
    <div id="footerColumns"></div>
  </div>
  <div class="container footer-bottom">
    <p>&copy; <span id="year"></span> <span id="footerCopyright">HomesPartner Real Estate. All rights reserved.</span></p>
  </div>
</footer>

<script src="assets/offices-data.js"></script>
<script src="assets/faqs-data.js"></script>
<script src="assets/contact-content-data.js"></script>
<script src="assets/site-chrome-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/theme-presets.js"></script>
<script src="assets/site-settings-data.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/data-loader.js"></script>
<script src="assets/page-header-bg.js"></script>
<script src="site-chrome.js"></script>
<script src="assets/world-map-paths.js"></script>
<script src="assets/geo-projection.js"></script>
<script src="script.js"></script>
<script src="contact-page.js"></script>

</body>
</html>
